name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject webhook config from secrets
        env:
          LOG_SCRIPT_URL: ${{ secrets.LOG_SCRIPT_URL }}
          LOG_SCRIPT_KEY: ${{ secrets.LOG_SCRIPT_KEY }}
        run: |
          mkdir -p _site
          sed -e "s|__LOG_SCRIPT_URL__|${LOG_SCRIPT_URL}|g" \
              -e "s|__LOG_SCRIPT_KEY__|${LOG_SCRIPT_KEY}|g" \
              index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
